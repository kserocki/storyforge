name: storyforge
services:
  db:
    image: postgres:17
    container_name: storyforge-db
    environment:
      POSTGRES_USER: storyforge
      POSTGRES_PASSWORD: storyforge
      POSTGRES_DB: storyforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyforge"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: